services:
  db:
    image: postgres:16
    container_name: payment
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medical_supply

    ports:
      - "5433:5432"

    volumes:
      - medical_supply_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: payment-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - medical_supply_redisdata:/data

volumes:
  medical_supply_pgdata:
  medical_supply_redisdata: