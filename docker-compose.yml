# Local development dependencies. Start with: docker compose up -d
# Redis is not included: nothing needs it yet. It will be added only if a later
# phase needs a durable queue.
services:
  db:
    image: postgres:16
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments_db
    ports:
      # Host port 5433, so it does not clash with other projects' Postgres on 5432.
      - '5433:5432'
    volumes:
      - payment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d payments_db']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  payment_pgdata:
